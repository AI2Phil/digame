# Pyrefly Configuration for Digame Project
# This configuration handles SQLAlchemy model instantiation and test-specific patterns

[tool.pyrefly]
# Project-specific settings
project_root = "."
python_version = "3.13"

# Ignore patterns for test files
[[tool.pyrefly.ignore]]
pattern = "test_*.py"
errors = [
    "Unexpected keyword argument",
    "has no attribute",
    "Expected a callable",
    "Cannot set item",
    "Object of class `NoneType`"
]

[[tool.pyrefly.ignore]]
pattern = "*/tests/*"
errors = [
    "Unexpected keyword argument",
    "has no attribute", 
    "Expected a callable",
    "Cannot set item",
    "Object of class `NoneType`"
]

# Ignore SQLAlchemy model instantiation patterns
[[tool.pyrefly.ignore]]
pattern = "*Model(*"
errors = ["Unexpected keyword argument"]

# Ignore service method errors (incomplete implementations)
[[tool.pyrefly.ignore]]
pattern = "*Service*"
errors = ["has no attribute"]

# Ignore FastAPI dependency injection in tests
[[tool.pyrefly.ignore]]
pattern = "app.dependency_overrides*"
errors = ["Cannot set item"]

[[tool.pyrefly.ignore]]
pattern = "*Depends*"
errors = ["has no attribute"]

# Ignore unittest.main issues
[[tool.pyrefly.ignore]]
pattern = "unittest.main*"
errors = ["Expected a callable"]

# SQLAlchemy model configuration
[tool.pyrefly.sqlalchemy]
# Tell Pyrefly these classes accept arbitrary keyword arguments
flexible_models = [
    "*.models.*",
    "*Model",
    "Base",
    "DeclarativeBase"
]

# Mock object patterns
[tool.pyrefly.mocking]
# Patterns that should be treated as mock objects
mock_patterns = [
    "Mock*",
    "create_mock_model",
    "MagicMock*",
    "mock_*"
]