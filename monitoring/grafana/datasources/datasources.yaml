apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "logstash-*"

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: digame_prod
    user: digame_user