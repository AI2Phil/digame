# Digame Platform - Production Alert Rules
groups:
  # System Health Alerts
  - name: system_health
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High CPU usage detected on {{ $labels.instance }}"
          description: "CPU usage is above 80% for more than 5 minutes on {{ $labels.instance }}"

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage detected on {{ $labels.instance }}"
          description: "Memory usage is above 85% for more than 5 minutes on {{ $labels.instance }}"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"}) * 100 < 15
        for: 10m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk space is below 15% on {{ $labels.instance }} ({{ $labels.mountpoint }})"

  # Application Health Alerts
  - name: application_health
    rules:
      - alert: BackendServiceDown
        expr: up{job="digame-backend"} == 0
        for: 1m
        labels:
          severity: critical
          component: backend
        annotations:
          summary: "Backend service is down"
          description: "The Digame backend service has been down for more than 1 minute"

      - alert: FrontendServiceDown
        expr: up{job="digame-frontend"} == 0
        for: 2m
        labels:
          severity: critical
          component: frontend
        annotations:
          summary: "Frontend service is down"
          description: "The Digame frontend service has been down for more than 2 minutes"

      - alert: HighAPIResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="digame-backend"}[5m])) > 2
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High API response time"
          description: "95th percentile API response time is above 2 seconds for more than 5 minutes"

      - alert: HighAPIErrorRate
        expr: rate(http_requests_total{job="digame-backend",status=~"5.."}[5m]) / rate(http_requests_total{job="digame-backend"}[5m]) > 0.05
        for: 3m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "High API error rate"
          description: "API error rate is above 5% for more than 3 minutes"

  # Database Health Alerts
  - name: database_health
    rules:
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL database is down"
          description: "PostgreSQL database has been down for more than 1 minute"

      - alert: HighDatabaseConnections
        expr: pg_stat_database_numbackends / pg_settings_max_connections * 100 > 80
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "High database connection usage"
          description: "Database connection usage is above 80% for more than 5 minutes"

      - alert: SlowDatabaseQueries
        expr: rate(pg_stat_database_tup_returned[5m]) / rate(pg_stat_database_tup_fetched[5m]) < 0.1
        for: 10m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Slow database queries detected"
          description: "Database query efficiency is below 10% for more than 10 minutes"

      - alert: DatabaseDeadlocks
        expr: increase(pg_stat_database_deadlocks[5m]) > 0
        for: 0m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Database deadlocks detected"
          description: "{{ $value }} database deadlocks detected in the last 5 minutes"

  # Cache Health Alerts
  - name: cache_health
    rules:
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          component: cache
        annotations:
          summary: "Redis cache is down"
          description: "Redis cache has been down for more than 1 minute"

      - alert: HighRedisMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 90
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "High Redis memory usage"
          description: "Redis memory usage is above 90% for more than 5 minutes"

      - alert: RedisConnectionsHigh
        expr: redis_connected_clients > 100
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "High Redis connection count"
          description: "Redis has more than 100 connected clients for more than 5 minutes"

  # Business Logic Alerts
  - name: business_metrics
    rules:
      - alert: HighUserRegistrationFailures
        expr: rate(user_registration_failures_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: business
        annotations:
          summary: "High user registration failure rate"
          description: "User registration failure rate is above 10% for more than 5 minutes"

      - alert: LowActiveUsers
        expr: active_users_count < 10
        for: 15m
        labels:
          severity: warning
          component: business
        annotations:
          summary: "Low active user count"
          description: "Active user count is below 10 for more than 15 minutes"

      - alert: HighNotificationFailures
        expr: rate(notification_delivery_failures_total[5m]) > 0.2
        for: 5m
        labels:
          severity: warning
          component: notifications
        annotations:
          summary: "High notification delivery failure rate"
          description: "Notification delivery failure rate is above 20% for more than 5 minutes"

  # Security Alerts
  - name: security_alerts
    rules:
      - alert: HighFailedLoginAttempts
        expr: rate(failed_login_attempts_total[5m]) > 5
        for: 2m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "High failed login attempt rate"
          description: "Failed login attempt rate is above 5 per minute for more than 2 minutes"

      - alert: SuspiciousAPIActivity
        expr: rate(http_requests_total{status="401"}[5m]) > 10
        for: 3m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "Suspicious API activity detected"
          description: "High rate of 401 unauthorized requests detected for more than 3 minutes"

      - alert: SecurityEventHigh
        expr: rate(security_events_total{severity="high"}[5m]) > 1
        for: 1m
        labels:
          severity: critical
          component: security
        annotations:
          summary: "High severity security events detected"
          description: "High severity security events are occurring at a rate above 1 per minute"

  # ML/AI Model Performance Alerts
  - name: ml_model_alerts
    rules:
      - alert: ModelAccuracyDrop
        expr: ml_model_accuracy < 0.8
        for: 10m
        labels:
          severity: warning
          component: ml
        annotations:
          summary: "ML model accuracy drop detected"
          description: "ML model {{ $labels.model_name }} accuracy has dropped below 80%"

      - alert: ModelPredictionLatencyHigh
        expr: histogram_quantile(0.95, rate(ml_prediction_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
          component: ml
        annotations:
          summary: "High ML prediction latency"
          description: "95th percentile ML prediction latency is above 5 seconds"

      - alert: ModelTrainingFailures
        expr: rate(ml_training_failures_total[10m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: ml
        annotations:
          summary: "ML model training failures detected"
          description: "ML model training failure rate is above 10% for more than 5 minutes"

  # Collaboration System Alerts
  - name: collaboration_alerts
    rules:
      - alert: HighMessageDeliveryLatency
        expr: histogram_quantile(0.95, rate(message_delivery_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          component: collaboration
        annotations:
          summary: "High message delivery latency"
          description: "95th percentile message delivery latency is above 1 second"

      - alert: WebSocketConnectionFailures
        expr: rate(websocket_connection_failures_total[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
          component: collaboration
        annotations:
          summary: "High WebSocket connection failure rate"
          description: "WebSocket connection failure rate is above 10% for more than 3 minutes"

  # Container and Infrastructure Alerts
  - name: container_alerts
    rules:
      - alert: ContainerHighCPU
        expr: rate(container_cpu_usage_seconds_total[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          component: container
        annotations:
          summary: "High CPU usage in container {{ $labels.name }}"
          description: "Container {{ $labels.name }} CPU usage is above 80% for more than 5 minutes"

      - alert: ContainerHighMemory
        expr: container_memory_usage_bytes / container_spec_memory_limit_bytes * 100 > 90
        for: 5m
        labels:
          severity: warning
          component: container
        annotations:
          summary: "High memory usage in container {{ $labels.name }}"
          description: "Container {{ $labels.name }} memory usage is above 90% for more than 5 minutes"

      - alert: ContainerRestarting
        expr: increase(container_restart_count[5m]) > 0
        for: 0m
        labels:
          severity: warning
          component: container
        annotations:
          summary: "Container {{ $labels.name }} is restarting"
          description: "Container {{ $labels.name }} has restarted {{ $value }} times in the last 5 minutes"