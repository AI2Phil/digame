# Logstash Pipeline Configuration for Digame Platform Logs
input {
  # Backend application logs
  beats {
    port => 5044
    type => "application"
  }
  
  # Docker container logs
  docker {
    path => "/var/lib/docker/containers/*/*.log"
    type => "docker"
    codec => json
  }
  
  # Nginx access logs
  file {
    path => "/var/log/nginx/access.log"
    type => "nginx_access"
    start_position => "beginning"
  }
  
  # Nginx error logs
  file {
    path => "/var/log/nginx/error.log"
    type => "nginx_error"
    start_position => "beginning"
  }
  
  # PostgreSQL logs
  file {
    path => "/var/log/postgresql/*.log"
    type => "postgresql"
    start_position => "beginning"
  }
  
  # Redis logs
  file {
    path => "/var/log/redis/*.log"
    type => "redis"
    start_position => "beginning"
  }
  
  # Application-specific logs
  file {
    path => "/app/logs/digame-backend.log"
    type => "backend_app"
    codec => json
    start_position => "beginning"
  }
  
  file {
    path => "/app/logs/digame-frontend.log"
    type => "frontend_app"
    codec => json
    start_position => "beginning"
  }
  
  # Security logs
  file {
    path => "/app/logs/security.log"
    type => "security"
    codec => json
    start_position => "beginning"
  }
  
  # Audit logs
  file {
    path => "/app/logs/audit.log"
    type => "audit"
    codec => json
    start_position => "beginning"
  }
}

filter {
  # Common timestamp parsing
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
  
  # Backend application log processing
  if [type] == "backend_app" {
    json {
      source => "message"
    }
    
    # Extract user information
    if [user_id] {
      mutate {
        add_field => { "user_context" => "%{user_id}" }
      }
    }
    
    # Extract request information
    if [request_id] {
      mutate {
        add_field => { "trace_id" => "%{request_id}" }
      }
    }
    
    # Categorize log levels
    if [level] == "ERROR" {
      mutate {
        add_tag => [ "error", "alert" ]
        add_field => { "severity" => "high" }
      }
    } else if [level] == "WARN" {
      mutate {
        add_tag => [ "warning" ]
        add_field => { "severity" => "medium" }
      }
    } else if [level] == "INFO" {
      mutate {
        add_field => { "severity" => "low" }
      }
    }
  }
  
  # Frontend application log processing
  if [type] == "frontend_app" {
    json {
      source => "message"
    }
    
    # Extract browser information
    if [user_agent] {
      useragent {
        source => "user_agent"
        target => "browser"
      }
    }
    
    # Extract performance metrics
    if [performance] {
      mutate {
        add_field => { 
          "page_load_time" => "%{[performance][page_load_time]}"
          "api_response_time" => "%{[performance][api_response_time]}"
        }
      }
    }
  }
  
  # Nginx access log processing
  if [type] == "nginx_access" {
    grok {
      match => { 
        "message" => "%{NGINXACCESS}"
      }
    }
    
    # Parse response time
    if [response_time] {
      mutate {
        convert => { "response_time" => "float" }
      }
    }
    
    # Categorize HTTP status codes
    if [response] {
      if [response] >= 500 {
        mutate {
          add_tag => [ "error", "5xx" ]
          add_field => { "severity" => "high" }
        }
      } else if [response] >= 400 {
        mutate {
          add_tag => [ "client_error", "4xx" ]
          add_field => { "severity" => "medium" }
        }
      } else if [response] >= 200 and [response] < 300 {
        mutate {
          add_tag => [ "success", "2xx" ]
          add_field => { "severity" => "low" }
        }
      }
    }
    
    # GeoIP lookup for client IP
    geoip {
      source => "clientip"
      target => "geoip"
    }
  }
  
  # Security log processing
  if [type] == "security" {
    json {
      source => "message"
    }
    
    # Extract security event details
    if [event_type] {
      mutate {
        add_field => { "security_category" => "%{event_type}" }
      }
    }
    
    # Categorize security severity
    if [severity] == "CRITICAL" {
      mutate {
        add_tag => [ "security_critical", "alert" ]
      }
    } else if [severity] == "HIGH" {
      mutate {
        add_tag => [ "security_high", "warning" ]
      }
    }
    
    # Extract threat indicators
    if [source_ip] {
      geoip {
        source => "source_ip"
        target => "threat_geoip"
      }
      
      # Check against threat intelligence
      translate {
        field => "source_ip"
        destination => "threat_level"
        dictionary_path => "/etc/logstash/threat_intel.yml"
        fallback => "unknown"
      }
    }
  }
  
  # Audit log processing
  if [type] == "audit" {
    json {
      source => "message"
    }
    
    # Extract audit event details
    if [action] {
      mutate {
        add_field => { "audit_action" => "%{action}" }
      }
    }
    
    # Extract resource information
    if [resource_type] and [resource_id] {
      mutate {
        add_field => { "resource" => "%{resource_type}:%{resource_id}" }
      }
    }
    
    # Compliance tagging
    if [compliance_framework] {
      mutate {
        add_tag => [ "compliance", "%{compliance_framework}" ]
      }
    }
  }
  
  # PostgreSQL log processing
  if [type] == "postgresql" {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{DATA:pid}\] %{WORD:level}: %{GREEDYDATA:pg_message}"
      }
    }
    
    # Extract slow query information
    if [pg_message] =~ /duration: (\d+\.\d+) ms/ {
      grok {
        match => { "pg_message" => "duration: %{NUMBER:query_duration:float} ms" }
      }
      
      if [query_duration] > 1000 {
        mutate {
          add_tag => [ "slow_query", "performance" ]
        }
      }
    }
  }
  
  # Docker container log processing
  if [type] == "docker" {
    # Extract container information
    if [container_name] {
      mutate {
        add_field => { "service" => "%{container_name}" }
      }
    }
    
    # Parse JSON logs from containers
    if [log] {
      json {
        source => "log"
        target => "container_log"
      }
    }
  }
  
  # Common enrichment for all logs
  mutate {
    add_field => { 
      "environment" => "production"
      "platform" => "digame"
      "log_processed_at" => "%{@timestamp}"
    }
  }
  
  # Remove unnecessary fields
  mutate {
    remove_field => [ "host", "path", "tags" ]
  }
}

output {
  # Main Elasticsearch output
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "digame-logs-%{+YYYY.MM.dd}"
    template_name => "digame-logs"
    template_pattern => "digame-logs-*"
    template => "/etc/logstash/templates/digame-logs-template.json"
    template_overwrite => true
  }
  
  # Security logs to separate index
  if "security" in [tags] or [type] == "security" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "digame-security-%{+YYYY.MM.dd}"
      template_name => "digame-security"
      template_pattern => "digame-security-*"
    }
  }
  
  # Audit logs to separate index
  if "audit" in [tags] or [type] == "audit" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "digame-audit-%{+YYYY.MM.dd}"
      template_name => "digame-audit"
      template_pattern => "digame-audit-*"
    }
  }
  
  # Critical errors to alerting system
  if "error" in [tags] and [severity] == "high" {
    http {
      url => "http://alertmanager:9093/api/v1/alerts"
      http_method => "post"
      content_type => "application/json"
      format => "json"
      mapping => {
        "alerts" => [
          {
            "labels" => {
              "alertname" => "LogError"
              "severity" => "%{severity}"
              "service" => "%{service}"
              "environment" => "production"
            }
            "annotations" => {
              "summary" => "High severity log error detected"
              "description" => "%{message}"
            }
            "generatorURL" => "http://kibana:5601"
          }
        ]
      }
    }
  }
  
  # Debug output for development
  if [level] == "DEBUG" {
    stdout {
      codec => rubydebug
    }
  }
}