name: Performance Testing

on:
  schedule:
    # Run performance tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      users:
        description: 'Number of concurrent users'
        required: false
        default: '50'
        type: string
      spawn_rate:
        description: 'User spawn rate per second'
        required: false
        default: '5'
        type: string
      run_time:
        description: 'Test duration (e.g., 300s, 5m)'
        required: false
        default: '180s'
        type: string
      test_type:
        description: 'Type of performance test'
        required: false
        default: 'fullstack'
        type: string
  workflow_call:
    # Allow this workflow to be called by other workflows

env:
  COMPOSE_FILE: docker-compose.performance.yml
  PROJECT_NAME: digame-performance-ci
  PERFORMANCE_ENDPOINT: ${{ secrets.PERFORMANCE_ENDPOINT }}

jobs:
  performance-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create performance reports directory
      run: |
        mkdir -p performance-reports
        mkdir -p performance-trends
        mkdir -p resource-monitoring

    - name: Build Docker images
      run: |
        docker compose -f $COMPOSE_FILE build --parallel

    - name: Start backend and frontend services
      run: |
        docker compose -f $COMPOSE_FILE -p $PROJECT_NAME up -d backend frontend

    - name: Wait for services to be healthy
      run: |
        echo "Waiting for backend to be healthy..."
        timeout 120 bash -c 'until curl -f http://localhost:8000/api/health; do sleep 2; done'
        
        echo "Waiting for frontend to be healthy..."
        timeout 120 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'
        
        echo "All services are healthy!"

    - name: Start resource monitoring
      run: |
        # Start system resource monitoring in background
        echo "Starting resource monitoring..."
        (
          while true; do
            timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            cpu_usage=$(top -bn1 | grep "Cpu(s)" | awk '{print $2}' | sed 's/%us,//')
            memory_usage=$(free | grep Mem | awk '{printf "%.1f", ($3/$2) * 100.0}')
            disk_io=$(iostat -d 1 1 | tail -n +4 | awk '{print $4","$5}' | head -1)
            
            echo "$timestamp,$cpu_usage,$memory_usage,$disk_io" >> resource-monitoring/system-metrics.csv
            sleep 5
          done
        ) &
        echo $! > resource-monitoring/monitor.pid
        
        # Initialize CSV header
        echo "timestamp,cpu_percent,memory_percent,disk_read_kb,disk_write_kb" > resource-monitoring/system-metrics.csv

    - name: Run Core Web Vitals Performance Tests
      if: github.event.inputs.test_type == 'core-web-vitals' || github.event.inputs.test_type == ''
      run: |
        docker compose -f $COMPOSE_FILE -p $PROJECT_NAME run --rm locust-master \
          locust -f /app/tests/performance/locustfile.py \
          --headless \
          --users ${{ github.event.inputs.users || '50' }} \
          --spawn-rate ${{ github.event.inputs.spawn_rate || '5' }} \
          --run-time ${{ github.event.inputs.run_time || '180s' }} \
          --host http://backend:8000 \
          --html /app/reports/core-web-vitals-report-${{ github.run_number }}.html \
          --csv /app/reports/core-web-vitals-data-${{ github.run_number }}

    - name: Run Frontend-Only Performance Tests
      if: github.event.inputs.test_type == 'frontend-only'
      run: |
        docker compose -f $COMPOSE_FILE -p $PROJECT_NAME run --rm locust-frontend \
          locust -f /app/tests/performance/frontend-only.py \
          --headless \
          --users ${{ github.event.inputs.users || '30' }} \
          --spawn-rate ${{ github.event.inputs.spawn_rate || '3' }} \
          --run-time ${{ github.event.inputs.run_time || '120s' }} \
          --host http://frontend:3000 \
          --html /app/reports/frontend-only-report-${{ github.run_number }}.html \
          --csv /app/reports/frontend-only-data-${{ github.run_number }}

    - name: Run Full-Stack Performance Tests
      if: github.event.inputs.test_type == 'fullstack'
      run: |
        docker compose -f $COMPOSE_FILE -p $PROJECT_NAME run --rm locust-master \
          locust -f /app/tests/performance/locustfile.py \
          --headless \
          --users ${{ github.event.inputs.users || '100' }} \
          --spawn-rate ${{ github.event.inputs.spawn_rate || '10' }} \
          --run-time ${{ github.event.inputs.run_time || '300s' }} \
          --host http://backend:8000 \
          --html /app/reports/fullstack-report-${{ github.run_number }}.html \
          --csv /app/reports/fullstack-data-${{ github.run_number }}

    - name: Collect service logs
      if: always()
      run: |
        echo "=== Backend Logs ===" > service-logs.txt
        docker compose -f $COMPOSE_FILE -p $PROJECT_NAME logs backend >> service-logs.txt 2>&1 || true
        echo "=== Frontend Logs ===" >> service-logs.txt
        docker compose -f $COMPOSE_FILE -p $PROJECT_NAME logs frontend >> service-logs.txt 2>&1 || true

    - name: Extract performance reports
      if: always()
      run: |
        # Copy reports from containers to host
        docker cp $(docker compose -f $COMPOSE_FILE -p $PROJECT_NAME ps -q locust-master):/app/reports/. ./performance-reports/ 2>/dev/null || true
        
        # List generated reports
        ls -la performance-reports/ || true

    - name: Stop resource monitoring
      if: always()
      run: |
        # Stop resource monitoring
        if [ -f "resource-monitoring/monitor.pid" ]; then
          kill $(cat resource-monitoring/monitor.pid) 2>/dev/null || true
          rm resource-monitoring/monitor.pid
        fi
        
        # Generate resource usage summary
        if [ -f "resource-monitoring/system-metrics.csv" ]; then
          echo "## Resource Usage Summary" > resource-monitoring/summary.md
          echo "### Peak Resource Usage" >> resource-monitoring/summary.md
          
          # Calculate peak CPU usage
          peak_cpu=$(tail -n +2 resource-monitoring/system-metrics.csv | cut -d',' -f2 | sort -nr | head -1)
          echo "- **Peak CPU**: ${peak_cpu}%" >> resource-monitoring/summary.md
          
          # Calculate peak memory usage
          peak_memory=$(tail -n +2 resource-monitoring/system-metrics.csv | cut -d',' -f3 | sort -nr | head -1)
          echo "- **Peak Memory**: ${peak_memory}%" >> resource-monitoring/summary.md
          
          # Calculate average resource usage
          avg_cpu=$(tail -n +2 resource-monitoring/system-metrics.csv | cut -d',' -f2 | awk '{sum+=$1; count++} END {if(count>0) printf "%.1f", sum/count; else print "0"}')
          avg_memory=$(tail -n +2 resource-monitoring/system-metrics.csv | cut -d',' -f3 | awk '{sum+=$1; count++} END {if(count>0) printf "%.1f", sum/count; else print "0"}')
          echo "- **Average CPU**: ${avg_cpu}%" >> resource-monitoring/summary.md
          echo "- **Average Memory**: ${avg_memory}%" >> resource-monitoring/summary.md
        fi

    - name: Compare with baseline
      if: always()
      run: |
        if [ -f "baseline-metrics.json" ]; then
          echo "Comparing current results with baseline..."
          
          # Extract current metrics from CSV files
          current_metrics="{}"
          if ls performance-reports/*_stats.csv 1> /dev/null 2>&1; then
            for csv_file in performance-reports/*_stats.csv; do
              if [ -f "$csv_file" ]; then
                avg_response_time=$(awk -F',' 'NR>1 && $1!="Aggregated" {sum+=$6; count++} END {if(count>0) print int(sum/count); else print 0}' "$csv_file")
                error_rate=$(awk -F',' 'NR>1 && $1!="Aggregated" {if($4>0) errors+=$5; requests+=$4} END {if(requests>0) print int((errors/requests)*100); else print 0}' "$csv_file")
                rps=$(awk -F',' 'NR>1 && $1!="Aggregated" {sum+=$7; count++} END {if(count>0) printf "%.2f", sum/count; else print 0}' "$csv_file")
                
                current_metrics=$(echo "$current_metrics" | jq --arg file "$(basename "$csv_file")" --argjson rt "$avg_response_time" --argjson er "$error_rate" --argjson rps "$rps" '. + {($file): {response_time: $rt, error_rate: $er, rps: $rps}}')
              fi
            done
          fi
          
          # Save current metrics
          echo "$current_metrics" > current-metrics.json
          
          # Compare with baseline and flag significant changes
          echo "## Baseline Comparison" > baseline-comparison.md
          
          # Check for performance regressions (>10% increase in response time or error rate)
          baseline_rt=$(jq -r '.response_time // 0' baseline-metrics.json)
          current_rt=$(jq -r '.response_time // 0' current-metrics.json)
          
          if [ "$baseline_rt" -gt 0 ] && [ "$current_rt" -gt 0 ]; then
            rt_change=$(echo "scale=2; (($current_rt - $baseline_rt) / $baseline_rt) * 100" | bc -l)
            if (( $(echo "$rt_change > 10" | bc -l) )); then
              echo "⚠️ **PERFORMANCE REGRESSION**: Response time increased by ${rt_change}%" >> baseline-comparison.md
            elif (( $(echo "$rt_change < -10" | bc -l) )); then
              echo "✅ **PERFORMANCE IMPROVEMENT**: Response time decreased by ${rt_change#-}%" >> baseline-comparison.md
            else
              echo "✅ Response time within acceptable range (${rt_change}% change)" >> baseline-comparison.md
            fi
          fi
        else
          echo "No baseline metrics found. Current run will establish baseline."
          
          # Create baseline from current run
          if ls performance-reports/*_stats.csv 1> /dev/null 2>&1; then
            for csv_file in performance-reports/*_stats.csv; do
              if [ -f "$csv_file" ]; then
                avg_response_time=$(awk -F',' 'NR>1 && $1!="Aggregated" {sum+=$6; count++} END {if(count>0) print int(sum/count); else print 0}' "$csv_file")
                error_rate=$(awk -F',' 'NR>1 && $1!="Aggregated" {if($4>0) errors+=$5; requests+=$4} END {if(requests>0) print int((errors/requests)*100); else print 0}' "$csv_file")
                rps=$(awk -F',' 'NR>1 && $1!="Aggregated" {sum+=$7; count++} END {if(count>0) printf "%.2f", sum/count; else print 0}' "$csv_file")
                
                echo "{\"response_time\": $avg_response_time, \"error_rate\": $error_rate, \"rps\": $rps, \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > baseline-metrics.json
                break
              fi
            done
          fi
        fi

    - name: Store metrics for trending
      if: always()
      run: |
        # Store key metrics in time-series format for trend analysis
        timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        run_number="${{ github.run_number }}"
        commit_sha="${{ github.sha }}"
        branch="${{ github.ref_name }}"
        
        # Initialize trends file if it doesn't exist
        if [ ! -f "performance-trends/metrics-history.jsonl" ]; then
          touch performance-trends/metrics-history.jsonl
        fi
        
        # Extract and store metrics from current run
        if ls performance-reports/*_stats.csv 1> /dev/null 2>&1; then
          for csv_file in performance-reports/*_stats.csv; do
            if [ -f "$csv_file" ]; then
              avg_response_time=$(awk -F',' 'NR>1 && $1!="Aggregated" {sum+=$6; count++} END {if(count>0) print int(sum/count); else print 0}' "$csv_file")
              error_rate=$(awk -F',' 'NR>1 && $1!="Aggregated" {if($4>0) errors+=$5; requests+=$4} END {if(requests>0) print int((errors/requests)*100); else print 0}' "$csv_file")
              rps=$(awk -F',' 'NR>1 && $1!="Aggregated" {sum+=$7; count++} END {if(count>0) printf "%.2f", sum/count; else print 0}' "$csv_file")
              p95_response_time=$(awk -F',' 'NR>1 && $1!="Aggregated" {sum+=$8; count++} END {if(count>0) print int(sum/count); else print 0}' "$csv_file")
              
              # Create trend entry
              trend_entry=$(jq -n \
                --arg timestamp "$timestamp" \
                --arg run_number "$run_number" \
                --arg commit_sha "$commit_sha" \
                --arg branch "$branch" \
                --arg test_type "${{ github.event.inputs.test_type || 'core-web-vitals' }}" \
                --arg users "${{ github.event.inputs.users || '50' }}" \
                --argjson response_time "$avg_response_time" \
                --argjson error_rate "$error_rate" \
                --argjson rps "$rps" \
                --argjson p95_response_time "$p95_response_time" \
                '{
                  timestamp: $timestamp,
                  run_number: $run_number,
                  commit_sha: $commit_sha,
                  branch: $branch,
                  test_type: $test_type,
                  users: $users,
                  metrics: {
                    avg_response_time: $response_time,
                    error_rate: $error_rate,
                    requests_per_second: $rps,
                    p95_response_time: $p95_response_time
                  }
                }')
              
              echo "$trend_entry" >> performance-trends/metrics-history.jsonl
              break
            fi
          done
        fi
        
        # Generate trend analysis for last 10 runs
        if [ -f "performance-trends/metrics-history.jsonl" ]; then
          echo "## Performance Trends (Last 10 Runs)" > performance-trends/trend-analysis.md
          
          # Get last 10 entries
          tail -10 performance-trends/metrics-history.jsonl > performance-trends/recent-trends.jsonl
          
          # Calculate trend direction for response time
          first_rt=$(head -1 performance-trends/recent-trends.jsonl | jq -r '.metrics.avg_response_time')
          last_rt=$(tail -1 performance-trends/recent-trends.jsonl | jq -r '.metrics.avg_response_time')
          
          if [ "$first_rt" -gt 0 ] && [ "$last_rt" -gt 0 ]; then
            if [ "$last_rt" -lt "$first_rt" ]; then
              echo "📈 **Trending Better**: Response time improving over last 10 runs" >> performance-trends/trend-analysis.md
            elif [ "$last_rt" -gt "$first_rt" ]; then
              echo "📉 **Trending Worse**: Response time degrading over last 10 runs" >> performance-trends/trend-analysis.md
            else
              echo "➡️ **Stable**: Response time stable over last 10 runs" >> performance-trends/trend-analysis.md
            fi
          fi
        fi

    - name: Analyze performance results
      if: always()
      run: |
        # Create comprehensive performance summary
        echo "# Performance Test Summary" > performance-summary.md
        echo "- **Test Run**: #${{ github.run_number }}" >> performance-summary.md
        echo "- **Commit**: ${{ github.sha }}" >> performance-summary.md
        echo "- **Branch**: ${{ github.ref_name }}" >> performance-summary.md
        echo "- **Test Type**: ${{ github.event.inputs.test_type || 'core-web-vitals' }}" >> performance-summary.md
        echo "- **Users**: ${{ github.event.inputs.users || '50' }}" >> performance-summary.md
        echo "- **Duration**: ${{ github.event.inputs.run_time || '180s' }}" >> performance-summary.md
        echo "- **Timestamp**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> performance-summary.md
        echo "" >> performance-summary.md
        
        # Include resource monitoring summary
        if [ -f "resource-monitoring/summary.md" ]; then
          cat resource-monitoring/summary.md >> performance-summary.md
          echo "" >> performance-summary.md
        fi
        
        # Include baseline comparison
        if [ -f "baseline-comparison.md" ]; then
          cat baseline-comparison.md >> performance-summary.md
          echo "" >> performance-summary.md
        fi
        
        # Include trend analysis
        if [ -f "performance-trends/trend-analysis.md" ]; then
          cat performance-trends/trend-analysis.md >> performance-summary.md
          echo "" >> performance-summary.md
        fi
        
        # Check for CSV files and extract key metrics
        if ls performance-reports/*.csv 1> /dev/null 2>&1; then
          echo "## Key Metrics" >> performance-summary.md
          for csv_file in performance-reports/*_stats.csv; do
            if [ -f "$csv_file" ]; then
              echo "### $(basename "$csv_file")" >> performance-summary.md
              echo '```' >> performance-summary.md
              head -10 "$csv_file" >> performance-summary.md
              echo '```' >> performance-summary.md
            fi
          done
        fi

    - name: Upload performance reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: performance-reports-${{ github.run_number }}
        path: |
          performance-reports/
          performance-summary.md
          service-logs.txt
          resource-monitoring/
          performance-trends/
          baseline-metrics.json
          current-metrics.json
          baseline-comparison.md
        retention-days: 30

    - name: Comment PR with performance results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          let summary = '## 🚀 Performance Test Results\n\n';
          
          try {
            if (fs.existsSync('performance-summary.md')) {
              const content = fs.readFileSync('performance-summary.md', 'utf8');
              summary += content;
            } else {
              summary += '⚠️ Performance summary not available\n';
            }
            
            // Add resource monitoring summary if available
            if (fs.existsSync('resource-monitoring/summary.md')) {
              const resourceSummary = fs.readFileSync('resource-monitoring/summary.md', 'utf8');
              summary += '\n' + resourceSummary + '\n';
            }
            
            // Add baseline comparison if available
            if (fs.existsSync('baseline-comparison.md')) {
              const baselineComparison = fs.readFileSync('baseline-comparison.md', 'utf8');
              summary += '\n' + baselineComparison + '\n';
            }
            
            // Add trend analysis if available
            if (fs.existsSync('performance-trends/trend-analysis.md')) {
              const trendAnalysis = fs.readFileSync('performance-trends/trend-analysis.md', 'utf8');
              summary += '\n' + trendAnalysis + '\n';
            }
            
            summary += '\n📊 [View detailed reports in artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n';
            
            // Check if there are any performance reports
            if (fs.existsSync('performance-reports')) {
              const files = fs.readdirSync('performance-reports');
              if (files.length > 0) {
                summary += '\n### Generated Reports:\n';
                files.forEach(file => {
                  summary += `- ${file}\n`;
                });
              }
            }
          } catch (error) {
            summary += `\n❌ Error generating summary: ${error.message}\n`;
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });

    - name: Check performance thresholds
      if: always()
      run: |
        # Define performance thresholds
        MAX_RESPONSE_TIME=2000  # 2 seconds
        MAX_ERROR_RATE=5        # 5%
        MIN_RPS=10              # 10 requests per second
        
        echo "Checking performance thresholds..."
        
        # Check if any CSV files exist
        if ls performance-reports/*_stats.csv 1> /dev/null 2>&1; then
          for csv_file in performance-reports/*_stats.csv; do
            if [ -f "$csv_file" ]; then
              echo "Analyzing $csv_file..."
              
              # Extract metrics (this is a simplified example)
              # In a real scenario, you'd parse the CSV more thoroughly
              avg_response_time=$(awk -F',' 'NR>1 && $1!="Aggregated" {sum+=$6; count++} END {if(count>0) print int(sum/count); else print 0}' "$csv_file")
              error_rate=$(awk -F',' 'NR>1 && $1!="Aggregated" {if($4>0) errors+=$5; requests+=$4} END {if(requests>0) print int((errors/requests)*100); else print 0}' "$csv_file")
              
              echo "Average Response Time: ${avg_response_time}ms"
              echo "Error Rate: ${error_rate}%"
              
              # Check thresholds
              if [ "$avg_response_time" -gt "$MAX_RESPONSE_TIME" ]; then
                echo "❌ PERFORMANCE THRESHOLD EXCEEDED: Response time ${avg_response_time}ms > ${MAX_RESPONSE_TIME}ms"
                exit 1
              fi
              
              if [ "$error_rate" -gt "$MAX_ERROR_RATE" ]; then
                echo "❌ PERFORMANCE THRESHOLD EXCEEDED: Error rate ${error_rate}% > ${MAX_ERROR_RATE}%"
                exit 1
              fi
              
              echo "✅ Performance thresholds passed"
            fi
          done
        else
          echo "⚠️ No performance data files found for threshold checking"
        fi

    - name: Cleanup
      if: always()
      run: |
        docker compose -f $COMPOSE_FILE -p $PROJECT_NAME down -v --remove-orphans