name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build:ci

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build backend
        working-directory: ./backend
        run: npm run build || true

  e2e-test:
    needs: [frontend-build, backend-build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build:ci

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Start backend
        working-directory: ./backend
        run: |
          echo "🚀 Starting backend on port 8000..."
          PORT=8000 npm start &
          echo $! > ../backend.pid

      - name: Wait for backend
        run: |
          echo "⏳ Waiting for backend on port 8000..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/api/health > /dev/null; then
              echo "✅ Backend is up and healthy"
              exit 0
            fi
            echo "   Attempt $i/30 - waiting 2 seconds..."
            sleep 2
          done
          echo "❌ Backend failed to start after 60 seconds"
          echo "Backend process status:"
          ps aux | grep node || echo "No node processes found"
          echo "Port 8000 status:"
          netstat -tlnp | grep :8000 || echo "Port 8000 not listening"
          exit 1

      - name: Install E2E dependencies
        working-directory: ./e2e
        run: npm ci

      - name: Run E2E tests
        working-directory: ./e2e
        run: |
          npx playwright install
          npx playwright test --project=${{ matrix.browser }}

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill -9 $(cat backend.pid) || true
          fi
