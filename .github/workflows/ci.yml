name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build:ci

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build backend
        working-directory: ./backend
        run: npm run build || true

  e2e-test:
    needs: [frontend-build, backend-build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          echo "📦 Installing frontend dependencies including devDependencies..."
          echo "Current NODE_ENV: $NODE_ENV"
          echo "Package.json devDependencies:"
          grep -A 5 '"devDependencies"' package.json || echo "No devDependencies section found"
          
          # Force clean install with devDependencies
          rm -rf node_modules package-lock.json || true
          NODE_ENV=development npm install
          
          echo "🔍 Verifying installation results..."
          echo "Node modules directory:"
          ls -la node_modules/ | head -10
          echo "Checking for @playwright specifically:"
          ls -la node_modules/@playwright/ || echo "@playwright directory not found"
          echo "Checking package.json for @playwright/test:"
          grep "@playwright/test" package.json || echo "@playwright/test not in package.json"

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build:ci

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Setup backend database
        working-directory: ./backend
        run: |
          echo "🗄️ Setting up SQLite database for CI..."
          mkdir -p data
          if [ -f "data/digame.db" ]; then
            echo "✅ Database file already exists"
            ls -la data/digame.db
          else
            echo "⚠️ Database file missing - creating minimal database for CI..."
            sqlite3 data/digame.db "
            CREATE TABLE IF NOT EXISTS users (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              email TEXT UNIQUE NOT NULL,
              username TEXT,
              firstName TEXT,
              lastName TEXT,
              passwordHash TEXT,
              role TEXT DEFAULT 'user',
              subscriptionTier TEXT DEFAULT 'free',
              teamId INTEGER,
              permissions TEXT DEFAULT '[]',
              isPlatformOwner BOOLEAN DEFAULT 0,
              isActive BOOLEAN DEFAULT 1,
              isVerified BOOLEAN DEFAULT 0,
              onboardingCompleted BOOLEAN DEFAULT 0,
              onboardingData TEXT DEFAULT '{}',
              unlockedFeatures TEXT DEFAULT '[]',
              profile TEXT DEFAULT '{}',
              preferences TEXT DEFAULT '{}',
              metadata TEXT DEFAULT '{}',
              lastLogin DATETIME,
              createdAt DATETIME DEFAULT CURRENT_TIMESTAMP,
              updatedAt DATETIME DEFAULT CURRENT_TIMESTAMP
            );
            
            CREATE TABLE IF NOT EXISTS notifications (
              id TEXT PRIMARY KEY,
              userId INTEGER,
              title TEXT NOT NULL,
              message TEXT NOT NULL,
              type TEXT DEFAULT 'info',
              category TEXT DEFAULT 'system',
              priority TEXT DEFAULT 'medium',
              read BOOLEAN DEFAULT 0,
              readAt DATETIME,
              timestamp DATETIME DEFAULT CURRENT_TIMESTAMP,
              actionUrl TEXT,
              actionText TEXT,
              createdAt DATETIME DEFAULT CURRENT_TIMESTAMP,
              updatedAt DATETIME DEFAULT CURRENT_TIMESTAMP
            );
            
            CREATE TABLE IF NOT EXISTS tasks (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              userId INTEGER NOT NULL,
              title TEXT NOT NULL,
              description TEXT,
              status TEXT DEFAULT 'pending',
              priority TEXT DEFAULT 'medium',
              category TEXT DEFAULT 'general',
              dueDate DATETIME,
              estimatedTime INTEGER,
              completedTime INTEGER,
              tags TEXT DEFAULT '[]',
              source TEXT,
              suggestionId TEXT,
              createdAt DATETIME DEFAULT CURRENT_TIMESTAMP,
              updatedAt DATETIME DEFAULT CURRENT_TIMESTAMP,
              completedAt DATETIME
            );"
            echo "✅ Minimal database created for CI"
            ls -la data/digame.db
          fi

      - name: Start backend
        working-directory: ./backend
        run: |
          echo "🚀 Starting backend on port 8000..."
          PORT=8000 npm start &
          echo $! > ../backend.pid

      - name: Wait for backend
        run: |
          echo "⏳ Waiting for backend on port 8000..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/api/health > /dev/null; then
              echo "✅ Backend is up and healthy"
              exit 0
            fi
            echo "   Attempt $i/30 - waiting 2 seconds..."
            sleep 2
          done
          echo "❌ Backend failed to start after 60 seconds"
          echo "Backend process status:"
          ps aux | grep node || echo "No node processes found"
          echo "Port 8000 status:"
          netstat -tlnp | grep :8000 || echo "Port 8000 not listening"
          exit 1

      - name: Start frontend server
        working-directory: ./frontend
        run: |
          echo "🚀 Starting Next.js frontend server on port 3001..."
          PORT=3001 npx next start &
          echo $! > ../frontend.pid

      - name: Wait for frontend server
        run: |
          echo "⏳ Waiting for frontend on port 3001..."
          for i in {1..30}; do
            if curl -s http://localhost:3001 > /dev/null; then
              echo "✅ Frontend is up on port 3001"
              exit 0
            fi
            echo "   Attempt $i/30 - waiting 2 seconds..."
            sleep 2
          done
          echo "❌ Frontend failed to start on port 3001"
          exit 1

      - name: Install Playwright and browsers
        working-directory: ./frontend
        run: |
          echo "📦 Force installing Playwright..."
          echo "Current working directory: $(pwd)"
          echo "Package.json exists: $(ls -la package.json)"
          
          # Force install @playwright/test regardless
          echo "Force installing @playwright/test..."
          npm install @playwright/test@^1.41.2 --save-dev --force
          
          echo "Verifying installation:"
          ls -la node_modules/@playwright/test/package.json || echo "Still not found"
          
          echo "📦 Installing Playwright browsers..."
          npx playwright install --with-deps

      - name: Verify Playwright installation
        working-directory: ./frontend
        run: |
          echo "🔍 Verifying Playwright installation..."
          echo "@playwright/test module: $(ls node_modules/@playwright/test/package.json 2>/dev/null || echo 'not found')"
          echo "Node modules structure:"
          ls -la node_modules/@playwright/ || echo "No @playwright directory"
          echo "Available npm scripts:"
          npm run | grep test:e2e || echo "No e2e scripts found"
          
          # Final verification
          if [ ! -f "node_modules/@playwright/test/package.json" ]; then
            echo "❌ @playwright/test still not found after installation attempts"
            exit 1
          else
            echo "✅ @playwright/test is available"
          fi

      - name: Run E2E tests
        working-directory: ./frontend
        run: |
          echo "🧪 Running E2E tests with browser: ${{ matrix.browser }}"
          echo "Frontend URL: http://localhost:3001"
          echo "Backend URL: http://localhost:8000"
          
          # Set environment variables for the tests
          export BASE_URL=http://localhost:3001
          export API_BASE_URL=http://localhost:8000
          export CI=true
          
          # List available test files
          echo "Available E2E test files:"
          ls -la tests/e2e/
          
          # Use npx directly to ensure proper Playwright resolution
          npx playwright test tests/e2e/integration-verification.spec.js --project=${{ matrix.browser }} --reporter=line

      - name: Stop servers
        if: always()
        run: |
          echo "🧹 Cleaning up servers..."
          if [ -f backend.pid ]; then
            echo "Stopping backend server..."
            kill -9 $(cat backend.pid) || true
            rm backend.pid
          fi
          if [ -f frontend.pid ]; then
            echo "Stopping frontend server..."
            kill -9 $(cat frontend.pid) || true
            rm frontend.pid
          fi
          # Kill any remaining processes
          pkill -f "node\|next\|npm" || true
          echo "✅ Server cleanup completed"
