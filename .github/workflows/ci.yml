name: CI/CD Pipeline - Fixed

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'  # Single version instead of matrix (from evolution analysis)
  PYTHON_VERSION: '3.11'  # Downgraded from 3.13 for compatibility

jobs:
  # Frontend Build - Simplified without matrix strategy
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        # Removed cache-dependency-path to fix caching issue
        
    - name: Cache npm dependencies (Fixed Implementation)
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          frontend/node_modules
        key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('frontend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-${{ env.NODE_VERSION }}-
          ${{ runner.os }}-node-

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: |
        npm ci --prefer-offline --no-audit

    - name: Type check
      working-directory: ./frontend
      run: npm run type-check

    - name: Lint
      working-directory: ./frontend
      run: npm run lint

    - name: Build frontend
      working-directory: ./frontend
      run: |
        npm run build
        
    - name: Verify build output
      working-directory: ./frontend
      run: |
        echo "Checking build output..."
        ls -la
        if [ -d ".next" ]; then
          echo "✅ .next directory exists"
          ls -la .next/
          # Ensure standalone output exists
          if [ -d ".next/standalone" ]; then
            echo "✅ Standalone build found"
          fi
        elif [ -d "out" ]; then
          echo "✅ out directory exists (static export)"
          ls -la out/
        elif [ -d "dist" ]; then
          echo "✅ dist directory exists"
          ls -la dist/
        else
          echo "❌ No build output found"
          echo "Available directories:"
          ls -la
          exit 1
        fi
        
    - name: Upload frontend build artifacts (Fixed naming)
      uses: actions/upload-artifact@v4
      if: success()  # Only upload if build succeeded
      with:
        name: frontend-build  # Simplified name without version
        path: |
          frontend/.next/
          frontend/out/
          frontend/dist/
        retention-days: 1
        if-no-files-found: error  # Fail if no files found

  # Backend Test - Updated Python version
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}  # 3.11 for compatibility
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run database migrations
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      run: |
        alembic upgrade head

    - name: Run backend tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        TESTING: true
      run: |
        python -m pytest tests/ -v --tb=short

  # E2E Testing - Fixed artifact dependency
  e2e-test:
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-test]  # Explicit dependencies
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: e2e_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        # Python dependencies
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
        # Frontend dependencies
        cd frontend && npm ci --prefer-offline --no-audit

    - name: Download frontend build artifacts (Fixed)
      uses: actions/download-artifact@v4
      with:
        name: frontend-build  # Matches upload name exactly
        path: frontend/
      # Added error handling
      continue-on-error: true
      id: download-artifacts
        
    - name: Handle missing artifacts
      working-directory: ./frontend
      run: |
        echo "Checking downloaded artifacts..."
        ls -la
        
        # Check if artifacts were downloaded successfully
        if [ "${{ steps.download-artifacts.outcome }}" = "failure" ]; then
          echo "⚠️ Artifact download failed, building fresh..."
          npm run build
        elif [ -d ".next" ]; then
          echo "✅ .next directory found from artifacts"
          ls -la .next/
        elif [ -d "out" ]; then
          echo "✅ out directory found from artifacts"
          ls -la out/
        elif [ -d "dist" ]; then
          echo "✅ dist directory found from artifacts"
          ls -la dist/
        else
          echo "⚠️ No build artifacts found, building fresh..."
          npm run build
        fi

    - name: Setup database
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_test_db
      run: |
        alembic upgrade head

    - name: Start backend server
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_test_db
        TESTING: true
      run: |
        python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
        echo $! > backend.pid
        
    - name: Wait for backend to be ready
      run: |
        echo "Waiting for backend server to start..."
        for i in {1..30}; do
          if curl -f http://localhost:8000/health 2>/dev/null; then
            echo "✅ Backend server is ready!"
            break
          fi
          echo "⏳ Attempt $i/30 - Backend not ready yet..."
          sleep 2
        done
        
        # Verify backend is actually responding
        curl -v http://localhost:8000/health || {
          echo "❌ Backend health check failed"
          echo "Backend logs:"
          ps aux | grep uvicorn
          exit 1
        }

    - name: Check system resources
      run: |
        echo "🖥️ System Resource Check:"
        echo "Memory usage:"
        free -h
        echo "Disk usage:"
        df -h
        echo "CPU info:"
        nproc
        echo "Available processes:"
        ps aux | wc -l

    - name: Pre-flight checks
      working-directory: ./frontend
      run: |
        echo "🔍 Pre-flight checks..."
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"
        
        # Verify all dependencies
        echo "Checking dependencies..."
        npm ls --depth=0 || echo "Some dependencies may be missing"
        
        # Check Next.js installation
        echo "Next.js version:"
        npx next --version
        
        # Verify Next.js info
        echo "Next.js configuration info:"
        npx next info
        
        # Verify build integrity
        if [ -d ".next" ]; then
          echo "✅ Build found, verifying..."
          ls -la .next/
          # Verify critical files exist
          if [ -f ".next/BUILD_ID" ]; then
            echo "✅ BUILD_ID found: $(cat .next/BUILD_ID)"
          else
            echo "⚠️ BUILD_ID not found"
          fi
          ls .next/static/ 2>/dev/null || echo "⚠️ No static files found"
        else
          echo "⚠️ No .next directory found"
        fi
        
        echo "Package.json scripts:"
        cat package.json | grep -A 10 '"scripts"'
        
        echo "Next.js config:"
        if [ -f "next.config.js" ]; then
          cat next.config.js
        elif [ -f "next.config.mjs" ]; then
          cat next.config.mjs
        else
          echo "No next.config.js/mjs found"
        fi

    - name: Verify build before start
      working-directory: ./frontend
      run: |
        echo "🔧 Verifying build before starting server..."
        if [ ! -d ".next" ]; then
          echo "No .next directory, building fresh..."
          npm run build
          
          # Verify build completed successfully
          if [ ! -d ".next" ]; then
            echo "❌ Build failed - no .next directory created"
            exit 1
          fi
        fi
        
        # Verify critical files exist
        if [ ! -f ".next/BUILD_ID" ]; then
          echo "❌ Invalid build - BUILD_ID missing"
          echo "Rebuilding..."
          rm -rf .next
          npm run build
        fi
        
        echo "✅ Build verification complete"
        ls -la .next/

    - name: Start frontend server with debugging
      working-directory: ./frontend
      env:
        NODE_ENV: production
        NEXT_TELEMETRY_DISABLED: 1
        PORT: 3000
      run: |
        echo "🚀 Starting frontend server..."
        
        # Kill any existing processes on ports 3000/3001
        lsof -ti:3000 | xargs kill -9 2>/dev/null || true
        lsof -ti:3001 | xargs kill -9 2>/dev/null || true
        
        # Start frontend server with explicit port and hostname
        echo "Starting with explicit configuration..."
        npm run dev -- --port 3000 --hostname 0.0.0.0 > ../frontend.log 2>&1 &
        FRONTEND_PID=$!
        echo $FRONTEND_PID > ../frontend.pid
        echo "Frontend PID: $FRONTEND_PID"
        
        # Extended wait with faster checks - 240 seconds total
        echo "⏳ Waiting for frontend server to start (up to 4 minutes)..."
        for i in {1..120}; do
          if [ $((i % 20)) -eq 1 ]; then
            echo "Attempt $i/120 - Checking frontend status..."
          fi
          
          # Check if process is still running
          if ! ps -p $FRONTEND_PID > /dev/null 2>&1; then
            echo "❌ Frontend process died! Checking logs..."
            echo "Process list:"
            ps aux | grep -E "(node|npm|next)" || echo "No Node processes found"
            echo "Port usage:"
            netstat -tulpn | grep LISTEN || echo "No listening ports found"
            echo "Frontend logs:"
            cat ../frontend.log 2>/dev/null || echo "No frontend.log available"
            exit 1
          fi
          
          # Check if frontend is responding on multiple ports
          if curl -f http://localhost:3000 2>/dev/null; then
            echo "✅ Frontend server is ready on port 3000!"
            break
          elif curl -f http://localhost:3001 2>/dev/null; then
            echo "✅ Frontend server is ready on port 3001!"
            break
          elif curl -f http://127.0.0.1:3000 2>/dev/null; then
            echo "✅ Frontend server is ready on 127.0.0.1:3000!"
            break
          fi
          
          # Show detailed status every 20 attempts
          if [ $((i % 20)) -eq 0 ]; then
            echo "📊 Status check at attempt $i:"
            echo "Process status:"
            ps aux | grep -E "(node|npm|next)" | head -5 || echo "No Node processes"
            echo "Port status:"
            netstat -tulpn | grep LISTEN | grep -E "(3000|3001)" || echo "Ports 3000/3001 not listening"
            echo "Memory usage:"
            free -h | head -2
            echo "Recent logs:"
            tail -5 ../frontend.log 2>/dev/null || echo "No recent logs"
          fi
          
          sleep 2
        done
        
        # Final comprehensive check
        if ! curl -f http://localhost:3000 2>/dev/null && ! curl -f http://localhost:3001 2>/dev/null && ! curl -f http://127.0.0.1:3000 2>/dev/null; then
          echo "❌ Frontend failed to start after 240 seconds"
          echo "🔍 Final diagnostics:"
          echo "Process list:"
          ps aux | grep -E "(node|npm|next)"
          echo "Port usage:"
          netstat -tulpn | grep LISTEN
          echo "Frontend process status:"
          if ps -p $FRONTEND_PID > /dev/null 2>&1; then
            echo "Process is still running"
          else
            echo "Process has died"
          fi
          echo "System resources:"
          free -h
          df -h
          echo "Complete frontend logs:"
          cat ../frontend.log 2>/dev/null || echo "No frontend.log available"
          echo "Next.js build debug:"
          npx next build --debug 2>&1 || echo "Build debug failed"
          exit 1
        fi

    - name: Install Playwright browsers
      working-directory: ./frontend
      run: npx playwright install --with-deps

    - name: Run E2E tests
      working-directory: ./frontend
      run: |
        # Determine which port the frontend is running on
        if curl -f http://localhost:3000 2>/dev/null; then
          export FRONTEND_URL=http://localhost:3000
        elif curl -f http://localhost:3001 2>/dev/null; then
          export FRONTEND_URL=http://localhost:3001
        else
          echo "❌ Cannot determine frontend URL"
          exit 1
        fi
        
        echo "🧪 Running E2E tests against $FRONTEND_URL"
        npm run test:e2e

    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results
        path: |
          frontend/test-results/
          frontend/playwright-report/
        retention-days: 7

    - name: Cleanup processes
      if: always()
      run: |
        echo "🧹 Cleaning up processes..."
        if [ -f backend.pid ]; then
          kill $(cat backend.pid) 2>/dev/null || true
          rm backend.pid
        fi
        if [ -f frontend.pid ]; then
          kill $(cat frontend.pid) 2>/dev/null || true
          rm frontend.pid
        fi
        # Kill any remaining processes
        pkill -f "uvicorn\|next\|npm" || true

  # Performance Testing (only on main branch)
  performance-test:
    runs-on: ubuntu-latest
    needs: [e2e-test]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        pip install locust
        cd frontend && npm ci

    - name: Download frontend build
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: frontend-build
        path: frontend/

    - name: Run performance tests
      run: |
        # Start services for performance testing
        cd frontend
        
        # Build if no artifacts were downloaded
        if [ ! -d ".next" ] && [ ! -d "out" ] && [ ! -d "dist" ]; then
          echo "No build artifacts found, building fresh..."
          npm run build
        fi
        
        npm start &
        cd ..
        python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
        
        # Wait for services
        sleep 30
        
        # Run performance tests if locustfile exists
        if [ -f "tests/performance/locustfile.py" ]; then
          locust -f tests/performance/locustfile.py --headless -u 10 -r 2 -t 60s --host http://localhost:3000
        else
          echo "⚠️ Performance test file not found, skipping performance tests"
        fi

    - name: Upload performance results
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: performance-reports/
        retention-days: 7