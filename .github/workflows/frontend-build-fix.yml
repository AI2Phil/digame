name: Frontend Build Fix
on: [push, pull_request]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # CRITICAL FIX: Clear node_modules cache
      - name: Clear node_modules cache
        run: rm -rf node_modules package-lock.json

      # CRITICAL FIX: Fresh install
      - name: Fresh install
        run: npm ci

      # CRITICAL FIX: Verify file exists
      - name: Verify file exists
        run: ls -la frontend/src/lib/api.ts

      # CRITICAL FIX: Check working directory
      - name: Check working directory
        run: pwd && ls -la

      # Additional verification steps
      - name: Verify frontend structure
        run: |
          echo "=== Frontend lib directory ==="
          ls -la frontend/src/lib/
          echo "=== API file content check ==="
          head -5 frontend/src/lib/api.ts

      # Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      # TypeScript check
      - name: TypeScript type check
        working-directory: ./frontend
        run: npm run type-check

      # Build frontend
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # Optional: Run tests
      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test --passWithNoTests