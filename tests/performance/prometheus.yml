global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "performance_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Backend API metrics
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # Frontend metrics (if available)
  - job_name: 'frontend'
    static_configs:
      - targets: ['frontend:3000']
    metrics_path: '/api/metrics'
    scrape_interval: 10s

  # Locust metrics
  - job_name: 'locust'
    static_configs:
      - targets: ['locust-master:8089']
    metrics_path: '/stats/requests'
    scrape_interval: 5s

  # System metrics from containers
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 10s

# Alerting rules for performance thresholds
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093