services:
  # Frontend Service
  frontend:
    image: node:20.18.1-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://backend-node:8001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend-node
    networks:
      - digame-network

  # Node.js Backend Service (Primary - Complete Test Zone)
  backend-node:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - NODE_ENV=production
      - PORT=8001
      - CORS_ORIGIN=http://localhost:3001
    volumes:
      - ./backend/data:/app/data
    networks:
      - digame-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Python FastAPI Backend Service (Optional - For Data Science)
  backend-python:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=sqlite:///./digame.db
    volumes:
      - ./app/data:/app/data
    networks:
      - digame-network
    profiles:
      - dual-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - digame-network
    profiles:
      - cache

  # PostgreSQL Database (Optional - for production)
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=digame
      - POSTGRES_USER=digame_user
      - POSTGRES_PASSWORD=digame_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - digame-network
    profiles:
      - database

networks:
  digame-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
